name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12"]

    env:
      # CI has a tty-less runner; make the consent gate fail fast instead of
      # waiting for input that will never arrive.
      REAPER_ACCEPT_TERMS: "1"
      REAPER_NONINTERACTIVE: "1"
      NO_COLOR: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: No third-party dependencies to install
        run: |
          python -m pip install --upgrade pip
          echo "requirements.txt declares no packages; nothing to install."

      - name: Syntax check every module
        run: python -m compileall -q core modules data dashboard tests main.py

      - name: Offline unit tests
        run: python -m unittest tests.test_offline -v

      - name: Localhost integration tests
        run: python -m unittest tests.test_smoke -v

      - name: CLI smoke checks
        run: |
          python main.py --version
          python main.py --help
          python main.py tools
          python main.py status
          python main.py doctor

      - name: Dashboard starts and answers
        run: |
          python main.py dashboard --port 8901 --quiet &
          sleep 3
          for route in /healthz /api/system /api/history /api/stats; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8901$route")
            echo "$route -> $code"
            [ "$code" = "200" ] || exit 1
          done

      - name: Installer scripts are valid shell
        run: |
          bash -n scripts/install.sh
          bash -n scripts/install-termux.sh
          bash -n scripts/run_tests.sh

      - name: The Termux installer refuses to run outside Termux
        run: |
          if env -u PREFIX bash scripts/install-termux.sh 2>&1 | grep -q "not look like Termux"; then
            echo "refused correctly"
          else
            echo "the Termux guard did not fire"; exit 1
          fi

  secrets:
    name: no committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for key-shaped literals
        run: |
          python - <<'PY'
          import pathlib, re, sys

          # Assembled from fragments so this file holds no key-shaped literal.
          prefixes = ["sk" + "-", "gh" + "p_", "AK" + "IA"]
          patterns = [re.escape(p) + r"[A-Za-z0-9]{16,}" for p in prefixes]
          patterns.append("-----BEGIN " + r"(RSA|OPENSSH|EC) PRIVATE KEY")
          combined = re.compile("|".join(patterns))

          skip = {".git", "tests", "__pycache__"}
          hits = []
          for path in pathlib.Path(".").rglob("*"):
              if not path.is_file() or skip & set(path.parts):
                  continue
              try:
                  text = path.read_text(encoding="utf-8", errors="ignore")
              except OSError:
                  continue
              for number, line in enumerate(text.splitlines(), 1):
                  if combined.search(line):
                      hits.append(f"{path}:{number}")

          if hits:
              print("::error::key-shaped literal found:")
              for hit in hits:
                  print("  " + hit)
              sys.exit(1)
          print("no key-shaped literals found")
          PY

      - name: .env must not be committed
        run: |
          if [ -f .env ]; then echo "::error::.env is committed"; exit 1; fi
          echo ".env is not committed"
